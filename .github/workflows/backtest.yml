name: backtest

# Downloads NSE bhavcopies (cached between runs, so a re-run resumes) and runs the
# volume-breakout backtest. Results go to the job log and a `results` artifact.
on:
  workflow_dispatch:
    inputs:
      start:
        description: First day to download
        default: "2018-01-01"
      end:
        description: Last day to download (blank = yesterday)
        default: ""
  push:
    branches: [claude/bold-ramanujan-tj3yqi]
    paths: [".github/workflows/backtest.yml", "research/**"]

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        shell: bash  # -eo pipefail, so a failed download isn't hidden by tee
        working-directory: research
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/requirements.txt

      - run: pip install pandas numpy pyarrow requests pytest

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Probe NSE (recent day)
        run: python scripts/probe_nse.py --date 2024-06-14

      - name: Probe NSE (2018, checks how far back the files go)
        continue-on-error: true
        run: python scripts/probe_nse.py --date 2018-01-02

      - name: Restore bhavcopy cache
        uses: actions/cache/restore@v4
        with:
          path: research/data/bhav
          key: bhav-${{ github.run_id }}
          restore-keys: bhav-

      - name: Download bhavcopies
        run: |
          END="${{ inputs.end }}"
          [ -z "$END" ] && END=$(date -u -d yesterday +%F)
          python -u scripts/fetch_bhavcopy.py --start "${{ inputs.start || '2018-01-01' }}" --end "$END" \
            --cache data/bhav --pause 0.4 2>&1 | tee fetch.log
          echo "cached days: $(find data/bhav -name '*.parquet' | wc -l)"

      - name: Save bhavcopy cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: research/data/bhav
          key: bhav-${{ github.run_id }}

      - name: Run backtest
        run: |
          python -u scripts/run_volume_breakout.py --cache data/bhav > results.json
          cat results.json

      - name: Export 2023+ signals and trades
        run: python -u scripts/export_trades.py --cache data/bhav --start 2023-01-01 --out out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            research/results.json
            research/fetch.log
            research/out/
