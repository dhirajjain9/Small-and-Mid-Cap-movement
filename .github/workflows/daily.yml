name: daily-screener

# Refreshes the screener data every weekday evening after NSE publishes the day's
# bhavcopy, and commits it to web/public/data. Vercel deploys on that commit.
# Scheduled runs only fire on the default branch; until this is merged, trigger it
# manually or by pushing to the working branch.
on:
  schedule:
    - cron: "0 14 * * 1-5" # 7:30 PM IST
  workflow_dispatch:
  workflow_run:
    workflows: [fundamentals]
    types: [completed]
  push:
    branches: [claude/bold-ramanujan-tj3yqi]
    paths: [".github/workflows/daily.yml", "pipeline/**", "research/nsesig/**", "data/reference/**", "data/fundamentals/**"]

permissions:
  contents: write

concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/requirements.txt

      - run: pip install pandas numpy pyarrow requests

      - name: Restore bhavcopy cache
        uses: actions/cache/restore@v4
        with:
          path: research/data/bhav
          key: bhav-${{ github.run_id }}
          restore-keys: bhav-

      - name: Download new bhavcopies
        run: python -u research/scripts/fetch_bhavcopy.py --start 2024-01-01 --end "$(TZ=Asia/Kolkata date +%F)" --cache research/data/bhav

      - name: Save bhavcopy cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: research/data/bhav
          key: bhav-${{ github.run_id }}

      - name: Restore BSE bhavcopy cache
        uses: actions/cache/restore@v4
        with:
          path: research/data/bse
          key: bse-${{ github.run_id }}
          restore-keys: bse-

      - name: Download new BSE bhavcopies
        run: |
          python -u research/scripts/fetch_bhavcopy.py --exchange bse --cache research/data/bse \
            --start "$(TZ=Asia/Kolkata date -d '400 days ago' +%F)" --end "$(TZ=Asia/Kolkata date +%F)"

      - name: Save BSE bhavcopy cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: research/data/bse
          key: bse-${{ github.run_id }}

      - name: Build snapshot
        run: python -u pipeline/build_snapshot.py --cache research/data/bhav --out web/public/data

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: screener snapshot $(jq -r .as_of web/public/data/meta.json)"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
