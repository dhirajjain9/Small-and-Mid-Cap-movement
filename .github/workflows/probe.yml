name: probe-sources

# One-off check of which company-list and price sources the runner can reach.
on:
  workflow_dispatch:
  push:
    branches: [claude/bold-ramanujan-tj3yqi]
    paths: [".github/workflows/probe.yml", "pipeline/probe_sources.py"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - run: python -u pipeline/probe_sources.py
